            "@type": "Question",

            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Siapp is a client-facing project-management platform for professional-services firms. It combines internal project tracking, automatic WhatsApp updates, and a simple client progress portal."

          {
            "@type": "Question",
            "name": "Does the client need to install an app?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The client receives a WhatsApp link and opens a mobile-friendly project page in their browser."
            }
          },
          {
            "@type": "Question",
            "name": "Does Siapp replace WhatsApp?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Siapp makes WhatsApp updates more structured and consistent. Clients can still contact the firm through its normal WhatsApp number."
            }
          },
          {
            "@type": "Question",
            "name": "Who is Siapp designed for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Siapp is initially designed for Malaysian construction and legal firms that currently manage project progress through spreadsheets, WhatsApp, and shared documents."
            }
          },
          {
            "@type": "Question",
            "name": "Can we use our existing project process?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Firms can begin from a starter project, duplicate an existing successful project, and adjust the tasks and dates to match their own process."
            }
          },
          {
            "@type": "Question",
            "name": "Can clients see everything in the project?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The firm controls which tasks and documents are visible to the client."
            }
          },
