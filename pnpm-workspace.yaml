packages:
  - 'apps/*'
  - 'backend/*'
  - 'packages/*'

allowBuilds:
  '@tailwindcss/oxide': true
  'unrs-resolver': true
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  # firebase-tools optional native regex engine — JS fallback is fine, skip native build
  re2: false
  # downloads the sentry-cli binary used for CI source-map upload (#27)
  '@sentry/cli': true
